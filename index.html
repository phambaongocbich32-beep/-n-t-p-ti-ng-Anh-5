<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ôn Tiếng Anh 5</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&family=Playfair+Display:wght@600;700;800&display=swap">
<style>
/* Layout: sticky navy bar over an ivory study desk; one centered column, cards by role, gold used only for emphasis */
:root{
  --bg:#f7f3ea; --surface:#ffffff; --surface2:#efe8d8; --ink:#1b2742; --muted:#5d6784;
  --navy:#14213d; --navy2:#22345c; --gold:#b8892b; --goldsoft:#f3e3b8; --teal:#1f7a6d; --tealsoft:#d6efe9;
  --rose:#b83f3f; --rosesoft:#f8dcdc; --line:#ddd3bd; --shadow:0 6px 22px rgba(20,33,61,.10);
  --fd:'Playfair Display',Georgia,serif; --fb:'Nunito','Segoe UI',system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f1830; --surface:#18254a; --surface2:#1f2f5a; --ink:#f1ead7; --muted:#a9b3cf;
  --navy:#0a1226; --navy2:#22345c; --gold:#e0b552; --goldsoft:#4a3d1c; --teal:#58c9b6; --tealsoft:#17433f;
  --rose:#ff8f8f; --rosesoft:#4a2230; --line:#2c3d6b; --shadow:0 6px 22px rgba(0,0,0,.4); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1830; --surface:#18254a; --surface2:#1f2f5a; --ink:#f1ead7; --muted:#a9b3cf;
  --navy:#0a1226; --navy2:#22345c; --gold:#e0b552; --goldsoft:#4a3d1c; --teal:#58c9b6; --tealsoft:#17433f;
  --rose:#ff8f8f; --rosesoft:#4a2230; --line:#2c3d6b; --shadow:0 6px 22px rgba(0,0,0,.4); color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--fb);font-size:17px;line-height:1.5;margin:0}
button{font:inherit;cursor:pointer}
h1,h2,h3{font-family:var(--fd);text-wrap:balance;margin:0;line-height:1.2}
.wrap{max-width:1080px;margin:0 auto;padding-inline:max(16px,env(safe-area-inset-left,0px)) max(16px,env(safe-area-inset-right,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--navy)}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--navy);color:#f6efdc;box-shadow:0 2px 12px rgba(0,0,0,.25)}
.bar{display:flex;align-items:center;gap:14px;padding-block:10px;flex-wrap:wrap}
.brand{font-family:var(--fd);font-weight:800;font-size:1.25rem;display:flex;align-items:center;gap:10px;cursor:pointer;background:none;border:0;color:inherit;padding:0}
.brand b{color:#e6bf62}
.crest{width:34px;height:34px;border-radius:50%;background:#e6bf62;color:#14213d;display:grid;place-items:center;font-weight:800;font-family:var(--fd)}
nav{display:flex;gap:4px;overflow-x:auto;flex:1;min-width:0;scrollbar-width:none}
nav button{background:none;border:0;color:#d9d2bd;padding:9px 14px;border-radius:999px;font-weight:700;white-space:nowrap}
nav button:hover{background:rgba(255,255,255,.1);color:#fff}
nav button.on{background:#e6bf62;color:#14213d}
.iconbtn{background:rgba(255,255,255,.1);border:0;color:#f6efdc;border-radius:999px;padding:8px 12px;font-weight:700}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
main{padding-block:26px 60px}
.hero{background:linear-gradient(135deg,var(--navy),var(--navy2));color:#f6efdc;border-radius:22px;padding:34px clamp(20px,4vw,44px);display:grid;gap:12px;box-shadow:var(--shadow)}
.hero h1{font-size:clamp(1.9rem,4.5vw,3rem)}
.hero h1 em{color:#e6bf62;font-style:normal}
.hero p{margin:0;max-width:56ch;color:#d9d2bd}
.btn{background:var(--gold);color:#14213d;border:0;padding:11px 20px;border-radius:12px;font-weight:800;box-shadow:0 3px 0 rgba(0,0,0,.18)}
.btn:hover{filter:brightness(1.06)}
.btn.alt{background:var(--surface2);color:var(--ink);box-shadow:none;border:1px solid var(--line)}
.btn.ok{background:var(--teal);color:#fff}
.btn.sm{padding:7px 13px;font-size:.9rem;border-radius:10px}
.grid{display:grid;gap:16px;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));margin-top:22px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:18px;box-shadow:var(--shadow);min-width:0}
.tile{align-content:start;text-align:left;cursor:pointer;display:grid;gap:6px;color:var(--ink)}
.tile:hover{transform:translateY(-2px);border-color:var(--gold)}
.tile h3{font-size:1.2rem}.tile p{margin:0;color:var(--muted);font-size:.95rem}
.tile .ic{font-size:2rem}
h2.t{font-size:clamp(1.5rem,3vw,2rem);margin:6px 0 4px}
.sub{color:var(--muted);margin:0 0 14px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}
.chip{border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:6px 14px;border-radius:999px;font-weight:700;font-size:.92rem}
.chip.on{background:var(--navy);color:#f6efdc;border-color:var(--navy)}
.chip.gold.on{background:var(--gold);color:#14213d;border-color:var(--gold)}
.vgrid{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(200px,1fr))}
.vc{background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden;display:flex;flex-direction:column;cursor:pointer;text-align:left;padding:0;color:var(--ink)}
.vc:hover{border-color:var(--gold);box-shadow:var(--shadow)}
.pic{aspect-ratio:16/10;width:100%;object-fit:cover;display:block;background:var(--surface2)}
.emo{aspect-ratio:16/10;width:100%;display:grid;place-items:center;font-size:3.4rem;background:var(--surface2)}
.vc .tx{padding:10px 12px}.vc b{font-size:1.1rem;display:block}.vc span{color:var(--muted);font-size:.92rem}
.unit{font-size:.75rem;letter-spacing:.08em;text-transform:uppercase;color:var(--gold);font-weight:800}
.pat{display:grid;gap:8px;margin:0;padding:0;list-style:none}
.pat li{display:grid;gap:2px;padding:10px 12px;background:var(--surface2);border-radius:12px}
.pat .q{font-weight:800}.pat .a{color:var(--teal);font-weight:700}.pat .v{color:var(--muted);font-size:.9rem}
.sp{background:none;border:0;font-size:1.1rem;padding:0 6px}
.say{background:var(--goldsoft);border:0;border-radius:999px;padding:6px 12px;font-weight:800;color:var(--ink)}
details.card summary{cursor:pointer;font-family:var(--fd);font-weight:700;font-size:1.15rem}
details.card[open] summary{margin-bottom:12px}
.stage{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:clamp(16px,3vw,28px);box-shadow:var(--shadow);display:grid;gap:16px;justify-items:center;text-align:center}
.stage .pic,.stage .emo{max-width:380px;border-radius:14px}
.stage .emo{font-size:5rem}
.opts{display:grid;gap:10px;width:100%;max-width:560px}
.opts.pics{grid-template-columns:repeat(2,1fr);max-width:620px}
.opt{background:var(--surface2);border:2px solid var(--line);border-radius:14px;padding:12px 14px;font-weight:800;color:var(--ink);text-align:center}
.opt:hover{border-color:var(--gold)}
.opt.good{background:var(--tealsoft);border-color:var(--teal)}
.opt.bad{background:var(--rosesoft);border-color:var(--rose)}
.opt .pic,.opt .emo{border-radius:10px;font-size:2.6rem}
.prog{height:10px;background:var(--surface2);border-radius:99px;width:100%;overflow:hidden}.prog i{display:block;height:100%;background:var(--gold);transition:width .3s}
.top{display:flex;gap:10px;align-items:center;justify-content:space-between;width:100%;flex-wrap:wrap}
.score{font-weight:800;color:var(--teal)}
input.txt{font:inherit;font-weight:800;padding:12px 14px;border-radius:12px;border:2px solid var(--line);background:var(--bg);color:var(--ink);text-align:center;min-width:0;width:100%;max-width:340px}
.letters{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.lt{width:44px;height:48px;border-radius:10px;border:2px solid var(--line);background:var(--surface2);font-weight:800;font-size:1.2rem;color:var(--ink);display:grid;place-items:center;padding:0}
.lt.fx{background:var(--tealsoft);border-color:var(--teal)}
.lt:disabled{opacity:.35}
.slot{width:44px;height:50px;border-bottom:4px solid var(--gold);font-size:1.6rem;font-weight:800;display:grid;place-items:center}
.kb{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;max-width:560px}
.kb button{width:38px;height:42px;border-radius:9px;border:1px solid var(--line);background:var(--surface2);font-weight:800;color:var(--ink);padding:0}
.kb button:disabled{opacity:.3}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px;width:100%}
.tl{aspect-ratio:1;border-radius:14px;border:2px solid var(--line);background:var(--surface2);display:grid;place-items:center;font-weight:800;padding:4px;overflow:hidden;color:var(--ink);font-size:.95rem}
.tl img{width:100%;height:100%;object-fit:cover;border-radius:8px}
.tl.sel{border-color:var(--gold);background:var(--goldsoft)}
.tl.done{opacity:.35;pointer-events:none}
.tl.back{background:var(--navy2);color:#e6bf62;font-size:2rem}
.ws{display:grid;gap:2px;user-select:none;touch-action:manipulation}
.ws button{aspect-ratio:1;width:clamp(26px,7.4vw,40px);border:0;background:var(--surface2);border-radius:6px;font-weight:800;color:var(--ink);padding:0}
.ws button.s{background:var(--gold);color:#14213d}.ws button.f{background:var(--teal);color:#fff}
.ttt{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;width:min(100%,330px)}
.ttt button{aspect-ratio:1;border-radius:14px;border:2px solid var(--line);background:var(--surface2);font-size:2.6rem;font-weight:800;color:var(--ink)}
.ttt .x{color:var(--teal)}.ttt .o{color:var(--rose)}
.wheel{width:230px;height:230px;border-radius:50%;border:6px solid var(--navy);background:conic-gradient(#b8892b 0 45deg,#1f7a6d 0 90deg,#14213d 0 135deg,#b83f3f 0 180deg,#b8892b 0 225deg,#1f7a6d 0 270deg,#14213d 0 315deg,#b83f3f 0 360deg);transition:transform 3s cubic-bezier(.15,.7,.2,1);position:relative}
.wheel::after{content:"★";position:absolute;inset:0;display:grid;place-items:center;color:#fff;font-size:2rem}
.pointer{font-size:2rem;margin-bottom:-14px;z-index:2}
.shake{animation:sh .3s}@keyframes sh{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.say-big{font-size:1.9rem;font-family:var(--fd);font-weight:700}
.vi{color:var(--muted)}
.gcard{display:grid;gap:4px;text-align:left}
/* flashcard */
.flip{perspective:900px;width:min(100%,420px)}
.flip>div{transition:transform .5s;transform-style:preserve-3d;position:relative;min-height:330px}
.flip.fl>div{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;border-radius:18px;border:1px solid var(--line);background:var(--surface);overflow:hidden;display:grid;align-content:center;justify-items:center;gap:8px;padding:12px}
.face.b{transform:rotateY(180deg);background:var(--navy);color:#f6efdc}
.face .pic,.face .emo{border-radius:12px}
/* test */
.part{margin-top:22px}
.part>h3{font-size:1.35rem;border-bottom:2px solid var(--gold);padding-bottom:6px;margin-bottom:10px}
.q{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;margin:12px 0;display:grid;gap:10px;min-width:0}
.q.good{border-color:var(--teal);background:var(--tealsoft)}.q.bad{border-color:var(--rose);background:var(--rosesoft)}
.qp{font-weight:700}
.ex{background:var(--goldsoft);border-radius:12px;padding:10px 14px;font-weight:700}
.ro{display:flex;flex-wrap:wrap;gap:10px}
.ro label{display:flex;gap:8px;align-items:center;padding:8px 14px;border-radius:12px;background:var(--surface2);border:2px solid transparent;cursor:pointer;font-weight:700}
.ro label:has(input:checked){border-color:var(--gold);background:var(--goldsoft)}
.pics4{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(130px,1fr))}
.pics4 label{border:3px solid var(--line);border-radius:14px;overflow:hidden;cursor:pointer;position:relative;display:block;background:var(--surface2)}
.pics4 label:has(input:checked){border-color:var(--gold)}
.pics4 input{position:absolute;opacity:0}
.pics4 .ltr{position:absolute;left:6px;top:6px;background:var(--navy);color:#fff;border-radius:8px;padding:0 8px;font-weight:800;z-index:2}
.zone{min-height:48px;border:2px dashed var(--line);border-radius:12px;padding:8px;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.chipw{background:var(--navy);color:#f6efdc;border:0;border-radius:10px;padding:8px 12px;font-weight:700}
.bank .chipw{background:var(--surface2);color:var(--ink);border:1px solid var(--line)}
select{font:inherit;padding:8px;border-radius:10px;border:2px solid var(--line);background:var(--bg);color:var(--ink)}
.ans{color:var(--teal);font-weight:800}.bad .ans{color:var(--rose)}
.pass{background:var(--surface);border:2px solid var(--gold);border-radius:20px;padding:22px;text-align:center;display:grid;gap:8px;justify-items:center}
.big{font-family:var(--fd);font-size:3.2rem;font-weight:800;color:var(--gold)}
.timer{position:sticky;top:calc(env(safe-area-inset-top,0px) + 62px);z-index:10;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:6px 14px;display:flex;justify-content:space-between;gap:10px;align-items:center;box-shadow:var(--shadow)}
dialog{border:1px solid var(--line);border-radius:18px;background:var(--surface);color:var(--ink);padding:22px;max-width:min(92vw,440px);box-shadow:var(--shadow)}
dialog::backdrop{background:rgba(10,18,38,.6)}
dialog label{display:grid;gap:6px;font-weight:700;margin:12px 0}
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:50}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:center}
.note{font-size:.9rem;color:var(--muted)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<canvas id="fx"></canvas>
<header>
  <div class="wrap bar">
    <button class="brand" id="brand" aria-label="Trang chủ"><span class="crest">5</span><span>Tiếng Anh <b>5</b></span></button>
    <nav id="nav" aria-label="Menu chính"></nav>
    <button class="iconbtn" id="setBtn" aria-label="Cài đặt giọng đọc">🔊 Giọng đọc</button>
  </div>
</header>
<main class="wrap" id="view"></main>
<dialog id="dlg">
  <h3>Giọng đọc & âm thanh</h3>
  <label>Giọng nữ (Anh Mỹ)<select id="voiceSel"></select></label>
  <label>Tốc độ đọc <input type="range" id="rate" min="0.6" max="1.1" step="0.05" value="0.85"></label>
  <div class="row" style="justify-content:flex-start"><button class="btn sm" id="testV">Nghe thử</button><button class="btn sm alt" id="closeD">Đóng</button></div>
  <p class="note">Giọng đọc lấy từ trình duyệt/thiết bị. Chrome, Edge hoặc Safari thường có sẵn giọng nữ en-US tự nhiên (Aria, Jenny, Samantha...).</p>
</dialog>

let voice=null,rate=store.get("rate",0.85),vname=store.get("voice","");
function voices(){return (window.speechSynthesis?speechSynthesis.getVoices():[])}
function pickVoice(){
  const all=voices();if(!all.length)return;
  const us=all.filter(v=>/^en[-_]US/i.test(v.lang));const pool=us.length?us:all.filter(v=>/^en/i.test(v.lang));
  let v=pool.find(x=>x.name===vname);
  if(!v){const pref=[/aria/i,/jenny/i,/ava\b/i,/samantha/i,/google us english/i,/zira/i,/allison|joanna|salli|kendra|kimberly|ivy|nicole|emma|susan/i];
    for(const r of pref){v=pool.find(x=>r.test(x.name));if(v)break}
    if(!v)v=pool.find(x=>!/david|mark|guy|alex|fred|tom|daniel|male\b/i.test(x.name))||pool[0]}
  voice=v||null;
  const sel=$("#voiceSel");sel.innerHTML="";pool.forEach(x=>sel.append(el("option",{value:x.name,...(voice&&x.name===voice.name?{selected:""}:{})},x.name+" ("+x.lang+")")));
}
if(window.speechSynthesis){speechSynthesis.onvoiceschanged=pickVoice;setTimeout(pickVoice,200)}
function say(t,cb){
  if(!window.speechSynthesis){cb&&cb();return}
  speechSynthesis.cancel();
  setTimeout(()=>{const u=new SpeechSynthesisUtterance(t);u.lang="en-US";if(voice)u.voice=voice;u.rate=rate;u.pitch=1.1;if(cb)u.onend=cb;speechSynthesis.speak(u)},40);
}
let AC=null;
function ac(){try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();if(AC.state==="suspended")AC.resume()}catch(e){}return AC}
function tone(f,t0,d,type="triangle",v=.16){const a=ac();if(!a)return;const o=a.createOscillator(),g=a.createGain();o.type=type;o.frequency.value=f;o.connect(g);g.connect(a.destination);const t=a.currentTime+t0;g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+.02);g.gain.exponentialRampToValueAtTime(.001,t+d);o.start(t);o.stop(t+d+.05)}
const sfxOk=()=>[523,659,784,1047,1319].forEach((f,i)=>tone(f,i*.08,.3));
const sfxNo=()=>{tone(200,0,.25,"sawtooth",.07);tone(150,.16,.3,"sawtooth",.07)};

const fx=$("#fx"),cx=fx.getContext("2d");let ps=[],raf=0;
function fit(){const d=devicePixelRatio||1;fx.width=innerWidth*d;fx.height=innerHeight*d;cx.setTransform(d,0,0,d,0,0)}
addEventListener("resize",fit);fit();
function burst(x,y){const h=Math.random()*360;for(let i=0;i<70;i++){const a=Math.random()*6.283,s=Math.random()*6+2;ps.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,l:1,c:`hsl(${h+Math.random()*50},95%,62%)`})}if(!raf)loop()}
function loop(){cx.clearRect(0,0,innerWidth,innerHeight);ps=ps.filter(p=>p.l>0);for(const p of ps){p.x+=p.vx;p.y+=p.vy;p.vy+=.09;p.vx*=.985;p.l-=.013;cx.globalAlpha=Math.max(p.l,0);cx.fillStyle=p.c;cx.beginPath();cx.arc(p.x,p.y,2.6,0,6.283);cx.fill()}cx.globalAlpha=1;raf=ps.length?requestAnimationFrame(loop):0;if(!raf)cx.clearRect(0,0,innerWidth,innerHeight)}
function fireworks(n=3){for(let i=0;i<n;i++)setTimeout(()=>burst(innerWidth*(.15+Math.random()*.7),innerHeight*(.15+Math.random()*.4)),i*260)}
